id: full-chain
name: 全链（全部 MATCH→CHAIN）
version: 1
description: >
  不设分流规则。全部流量走第二跳链式代理；
  YAML 不嵌入 TUN（由 Clash Verge 开关控制）；DoH 解析器显式走 DIRECT。
  导入后在 Verge 里切全局、开 TUN、选 CHAIN。
compose: []
match: hop2

notes: |
  无 pack。builder 对此预设走精简输出：rules 仅 MATCH,CHAIN，
  不写 tun / geox-url / HOP1 组 / 内网直连；显式 GLOBAL 组默认 CHAIN。
