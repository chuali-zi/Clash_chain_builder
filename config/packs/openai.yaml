id: openai
name: OpenAI / ChatGPT / Codex / Sora → HOP2（一方域名）
version: 1
target: hop2
priority: 315
description: >
  ChatGPT Web/Desktop、OpenAI API、Codex、Sora、oaistatic/oaiusercontent
  等一方流量强制第二跳。
sources:
  - v2fly/domain-list-community data/openai
  - MetaCubeX geosite:openai
  - OpenAI Help network recommendations
  - blackmatrix7 / ACL4SSR OpenAI lists（筛除危险共享后缀后）
  - scout agents 2026-08

rules:
  # ========== 进程 ==========
  - PROCESS-NAME,ChatGPT.exe
  - PROCESS-NAME,Codex.exe
  - PROCESS-NAME,ChatGPT Classic.exe
  - PROCESS-NAME,ChatGPT
  - PROCESS-NAME,Codex
  - PROCESS-NAME,codex
  - PROCESS-NAME,codex.exe
  - PROCESS-NAME-WILDCARD,*ChatGPT*
  - PROCESS-NAME-WILDCARD,*chatgpt*
  - PROCESS-PATH-REGEX,(?i).*ChatGPT.*\.(exe|app).*
  - PROCESS-PATH-REGEX,(?i).*Codex.*\.(exe|app).*

  # ========== geosite ==========
  - GEOSITE,openai
  - GEOSITE,OPENAI

  # ========== 一方 DOMAIN-SUFFIX ==========
  - DOMAIN-SUFFIX,openai.com
  - DOMAIN-SUFFIX,chatgpt.com
  - DOMAIN-SUFFIX,oaistatic.com
  - DOMAIN-SUFFIX,oaiusercontent.com
  - DOMAIN-SUFFIX,oaistatsig.com
  - DOMAIN-SUFFIX,sora.com
  - DOMAIN-SUFFIX,chat.com
  - DOMAIN-SUFFIX,chatgpt.site
  - DOMAIN-SUFFIX,crixet.com
  - DOMAIN-SUFFIX,openai.org
  - DOMAIN-SUFFIX,openai.fund

  # Azure / Imgix / LiveKit（OpenAI 命名或官方 Advanced Voice）
  - DOMAIN-SUFFIX,openaiapi-site.azureedge.net
  - DOMAIN,openaiapi-site.azureedge.net
  - DOMAIN-SUFFIX,openaicom.imgix.net
  - DOMAIN,openaicom.imgix.net
  - DOMAIN-SUFFIX,chatgpt.livekit.cloud
  - DOMAIN,chatgpt.livekit.cloud

  # CF 前端（v2fly）
  - DOMAIN,openai.com.cdn.cloudflare.net
  - DOMAIN,chat.openai.com.cdn.cloudflare.net

  # ========== 关键主机（冗余） ==========
  - DOMAIN,api.openai.com
  - DOMAIN,eu.api.openai.com
  - DOMAIN,beta.api.openai.com
  - DOMAIN,platform.api.openai.com
  - DOMAIN,chat.openai.com
  - DOMAIN,auth.openai.com
  - DOMAIN,auth0.openai.com
