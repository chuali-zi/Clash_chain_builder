dns_policy_keys:
  - geosite:openai
  - +.openai.com
  - +.chatgpt.com
  - +.oaistatic.com
  - +.oaiusercontent.com
  - +.oaistatsig.com
  - +.sora.com
  - +.chat.com
  - +.chatgpt.site
  - +.crixet.com
  - openaiapi-site.azureedge.net
  - +.chatgpt.livekit.cloud
  - ws.chatgpt.com

sniffer_force_domain:
  - +.openai.com
  - +.chatgpt.com
  - +.oaistatic.com
  - +.oaiusercontent.com
  - +.oaistatsig.com
  - +.sora.com
  - +.chat.com
  - +.chatgpt.livekit.cloud
  - openaiapi-site.azureedge.net
  - ws.chatgpt.com

notes: |
  Codex ChatGPT 登录走 chatgpt.com/backend-api；API Key 走 api.openai.com。
  Advanced Voice 另需 LiveKit + 动态 UDP IP（openai.com/chatgpt-voice.json），
  进程规则可兜底 Desktop。侧信道见 openai-sidechannel.yaml。
