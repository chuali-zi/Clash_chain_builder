id: cn-direct
name: 国内常用站 + 中文 AI → DIRECT
version: 1
target: direct
priority: 100
description: >
  Bilibili 生态、BAT、支付、流媒体、国产 AI 等高频域名直连，
  并以 GEOSITE,CN / GEOIP,CN 兜底。priority 低于 HOP2 包，
  确保 Anthropic/OpenAI 不会被 CN 规则抢走。
sources:
  - blackmatrix7 BiliBili / China / ChinaMedia / AliPay / WeChat / DouYin
  - Loyalsoldier GEOSITE,CN / GEOIP,CN
  - ref/anthropic-openai-*-jp-chain.yaml
  - scout agents 2026-08

