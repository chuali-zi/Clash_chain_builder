[project]
name = "clash-chain-builder"
version = "0.2.0"
description = "机场订阅 + SOCKS5 落地 → mihomo / Clash for Windows 两跳链式配置"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "clash-chain-builder contributors" }]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.scripts]
chain-builder = "chain_builder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chain_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
